apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: default
  namespace: argocd
spec:
  description: ModelGate lab deployment
  sourceRepos:
    - https://github.com/berikbp/modelgate
  destinations:
    - server: https://kubernetes.default.svc
      namespace: default
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: apps
      kind: Deployment
    - group: ""
      kind: Service
    - group: ""
      kind: ConfigMap
