apiVersion: apps/v1
kind: Deployment
metadata:
  name: modelgate
spec:
  replicas: 2
  selector:
    matchLabels:
      app: modelgate
  template:
    metadata:
      labels:
        app: modelgate
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/berikbp/modelgate:93482e37dbf9772a45879053cb8cd8f17342c3ea
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: modelgate-config
                  key: PORT
            - name: UVICORN_LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: modelgate-config
                  key: UVICORN_LOG_LEVEL
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: API_KEY
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
